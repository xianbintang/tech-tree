site_name: tech-tree
site_description: AI-native 论文与技术博文学习知识库
repo_url: https://github.com/xianbintang/tech-tree
docs_dir: _site_src
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: 深色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: 浅色}
plugins:
  - search:
      lang: [zh, en]
  - roamlinks
markdown_extensions:
  - admonition
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
