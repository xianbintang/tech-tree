# 研究兴趣画像 —— 关键词打分（Python 粗排）与 LLM 精排（triage skill）共用。
# 迁移自 ~/.claude/skills/_shared/user-config.json（2026-09-25）。

research_direction:
  summary: "Agentic RL 训练基础设施：沙箱/执行环境、训练系统与调度、code/terminal/computer-use agent 的训练与评测"
  persona: >-
    用户的研究方向是 agentic RL 训练基础设施（沙箱与执行环境、训练系统与 GPU 调度、
    code/terminal/computer-use agent 的训练与评测）。用户本职是做沙箱平台与调度系统的，
    看论文第一关心「这套东西在生产上跑得起来吗、成本和密度是多少、我们的平台要补什么能力」。
  focus_areas:
    - agentic RL / RLVR 后训练算法与训练系统（rollout、off-policy、GRPO、抢占、样本级派发）
    - 沙箱与执行环境基础设施（microVM、容器运行时、隔离、密度、超卖、冷启动、镜像分发）
    - 训练侧系统工程（GPU 调度、KV cache、推理服务、checkpoint、弹性与容错）
    - code / SWE / terminal / computer-use / GUI agent 的训练、环境合成与评测基准
    - agent 轨迹数据、环境构造与可验证奖励的工程实现
  adjacent_areas:
    - LLM 推理与服务优化（只在与训练吞吐/成本相关时才算相关）
    - 长程 agent 架构、记忆与上下文压缩（与训练成本相关时算相关）
  irrelevant_areas:
    - 医学影像与生物医药
    - 语音合成与音频生成
    - 天气气候预测
    - 金融交易与推荐系统
    - 纯视觉生成 / 视频生成（除非直接服务于 agent 训练环境）
    - 机器人本体控制与 VLA（除非其训练基础设施本身是论文主题）
    - 纯 NLP 任务微调、纯 prompt 工程
    - OCR 与文档解析

