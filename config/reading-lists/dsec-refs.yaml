# DSec 引用链精读清单。
#   uv run python -m pipeline.reading_list create config/reading-lists/dsec-refs.yaml
# 每个 category 建一个 tracking issue；给 issue 打上 `to-read` 标签，本地 queue 就会按分类批量精读、出一个 PR。
#
# 条目字段：type（paper | post）、id（arXiv ID；非 arXiv 用 <year>-<first-author>-<slug>；文档/博客用 slug）、
#           title、url（论文落地页 / PDF / DOI 均可，fetch_paper 会自己找 PDF）、why（为什么读）。

name: dsec-refs
parent:
