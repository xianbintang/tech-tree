categories:
  - key: A
    title: "DSec 锚点"
    description: |
      先读 DSec 本身，后续所有笔记都回链 [[2609.22978]]。
      未纳入精读的引用（与沙箱基础设施无关）：GPT-4、InstructGPT、Concrete Problems in AI Safety、
      Defining and Characterizing Reward Hacking、SWE-bench、OSWorld、WebArena、OCI Image Spec、Moby、
      DXVK、OpenCode、DeepSeek-V3.2 / R1 / LLM、REINFORCE++、Shi et al. 2026、virtio-pmem 文档（并入 DSec 笔记）。
    items:
