# 订阅源。新增源：改这里提 PR，或开一个 "add-source" issue。
# type:
#   rss        —— RSS/Atom，按发布时间窗口过滤
#   sitemap    —— 站点地图：按 pattern 正则挑文章 URL，用 <lastmod> 当日期（适合无 RSS 的 JS 站点）
#   html_links —— 抓列表页、正则提链接，按“首次见到”判新
#   hf_models  —— HuggingFace 组织的新模型发布（Kimi/Qwen/混元这类官网是纯 JS 的实验室）
# weight：加到关键词得分上；post_min_score=2，所以 weight≥2 的源每篇都进 LLM 精排候选，
#         weight 0/1 的（大厂综合博客）要靠关键词命中才能入围，避免营销稿刷屏。
# title_filter：可选，标题正则白名单，用于噪音大的公司博客。

papers:
  arxiv:
    categories: [cs.DC, cs.LG, cs.AI, cs.SE, cs.OS, cs.CL]
    max_results_per_day: 1500  # 6 个分类每天投稿量约 1000+
  huggingface:
    daily: true
    trending: true

posts:
  window_days: 2   # 只看最近 N 天发布/更新的
  feeds:
    # ───────── Anthropic ─────────
    - {name: Anthropic Engineering, type: sitemap, url: "https://www.anthropic.com/sitemap.xml", pattern: '^https://www\.anthropic\.com/engineering/[a-z0-9-]+$', weight: 4}
    - {name: Anthropic Research, type: sitemap, url: "https://www.anthropic.com/sitemap.xml", pattern: '^https://www\.anthropic\.com/research/[a-z0-9-]+$', weight: 3}
    - {name: Anthropic News, type: sitemap, url: "https://www.anthropic.com/sitemap.xml", pattern: '^https://www\.anthropic\.com/news/[a-z0-9-]+$', weight: 1}
    - {name: Transformer Circuits, type: rss, url: "https://transformer-circuits.pub/feed.xml", weight: 2}

    # ───────── OpenAI ─────────
    - {name: OpenAI Research, type: sitemap, url: "https://openai.com/sitemap.xml/research/", pattern: '^https://openai\.com/index/[a-z0-9-]+/$', weight: 3}
    - {name: OpenAI Engineering, type: sitemap, url: "https://openai.com/sitemap.xml/engineering/", pattern: '^https://openai\.com/index/[a-z0-9-]+/$', weight: 4}
    - {name: OpenAI Publications, type: sitemap, url: "https://openai.com/sitemap.xml/publication/", pattern: '^https://openai\.com/index/[a-z0-9-]+/$', weight: 3}
    - {name: OpenAI News, type: rss, url: "https://openai.com/news/rss.xml", weight: 0}

    # ───────── Google ─────────
    - {name: Google DeepMind, type: rss, url: "https://deepmind.google/blog/rss.xml", weight: 1}
    - {name: Google Research, type: rss, url: "https://research.google/blog/rss/", weight: 1}

    # ───────── AWS / Amazon ─────────
    - {name: AWS Compute Blog, type: rss, url: "https://aws.amazon.com/blogs/compute/feed/", weight: 1}        # Lambda / Firecracker
    - {name: AWS Containers Blog, type: rss, url: "https://aws.amazon.com/blogs/containers/feed/", weight: 1}
    - {name: AWS Machine Learning Blog, type: rss, url: "https://aws.amazon.com/blogs/machine-learning/feed/", weight: 0}
    - {name: AWS Architecture Blog, type: rss, url: "https://aws.amazon.com/blogs/architecture/feed/", weight: 0}
    - {name: Amazon Science, type: rss, url: "https://www.amazon.science/index.rss", weight: 1}
    - {name: All Things Distributed (Werner Vogels), type: rss, url: "https://www.allthingsdistributed.com/atom.xml", weight: 2}

    # ───────── Meta ─────────
    - name: Meta AI Blog
      type: html_links
      url: "https://ai.meta.com/blog/"
      pattern: 'href="(https://ai\.meta\.com/blog/[a-z0-9-]+/)"'
      weight: 1
    - {name: Meta Engineering, type: rss, url: "https://engineering.fb.com/feed/", weight: 1}

    # ───────── DeepSeek ─────────
    - {name: DeepSeek News, type: sitemap, url: "https://www.deepseek.com/sitemap.xml", pattern: '^https://www\.deepseek\.com/en/news/[a-z0-9-]+/?$', weight: 4}
    - {name: DeepSeek, type: hf_models, org: deepseek-ai, weight: 4}

    # ───────── Kimi / Moonshot ─────────
    - {name: Kimi (Moonshot), type: hf_models, org: moonshotai, weight: 4}

    # ───────── Alibaba / Qwen ─────────
    - {name: Qwen, type: hf_models, org: Qwen, weight: 3}
    - name: Alibaba Cloud Blog
      type: html_links
      url: "https://www.alibabacloud.com/blog"
      pattern: 'href="(https://www\.alibabacloud\.com/blog/[a-z0-9-]+_[0-9]+)"'
      title_filter: 'qwen|model|agent|infer|training|gpu|serverless|sandbox|container|kubernetes|pai'
      weight: 1

    # ───────── Tencent / 混元 ─────────
    - {name: Tencent Hunyuan, type: hf_models, org: tencent, title_filter: '^(hy|hunyuan)', weight: 3}

    # ───────── 其它实验室 / 训练与推理系统 ─────────
