    - {name: Andrej Karpathy, type: rss, url: "https://karpathy.github.io/feed.xml", weight: 4}
    - {name: Lilian Weng, type: rss, url: "https://lilianweng.github.io/index.xml", weight: 4}
    - {name: Chip Huyen, type: rss, url: "https://huyenchip.com/feed.xml", weight: 3}
    - {name: Jason Wei, type: rss, url: "https://www.jasonwei.net/blog?format=rss", weight: 3}
