name: inbox-to-issues

# 合并 daily/*（或任何带勾选清单的）PR 后：把勾选的条目变成 to-read issue 并触发精读
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  convert:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, '<!-- read type=')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - name: Create issues for ticked items
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --dispatch: issues opened by GITHUB_TOKEN don't fire `issues` events,
        # so deep-read is started explicitly via workflow_dispatch.
        run: uv run python -m pipeline.inbox_issues --pr ${{ github.event.pull_request.number }} ${{ vars.AUTO_DEEP_READ != 'false' && '--dispatch' || '' }}
