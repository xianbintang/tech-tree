name: pages

# main 分支上的知识库 → GitHub Pages 静态站点（mkdocs-material，支持中文搜索与 [[双链]]）
on:
  push:
    branches: [master]
    paths: ["docs/**", "inbox/**", "notes/**", "wiki/**", "reports/**", "sources/**", "mkdocs.yml", "scripts/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # upstream has no floating v10 tag
      - run: uv sync --group site
      - run: scripts/build_site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
