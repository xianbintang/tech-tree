name: wiki-lint

# 每周一 + 每次知识库变更：体检断链/孤儿页/frontmatter，问题汇总到一个 wiki-lint issue
on:
  schedule:
    - cron: "0 1 * * 1"
  push:
    branches: [master]
    paths: ["notes/**", "wiki/**", "reports/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run python -m pipeline.wiki_lint
      - name: Sync lint issue
        run: |
          count=$(cat .cache/lint_count)
          existing=$(gh issue list --label wiki-lint --state open --json number --jq '.[0].number // empty')
          if [ "$count" = "0" ]; then
            [ -n "$existing" ] && gh issue close "$existing" --comment "✅ 体检通过，自动关闭。"
            exit 0
          fi
          { echo "知识库体检（$(date -u +%F)）："; echo; cat .cache/lint.md; echo;
            echo "> 修复方式：在本地或评论 \`@claude 按 wiki-lint 修复\`。"; } > .cache/lint_body.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file .cache/lint_body.md
          else
            gh issue create --title "wiki-lint: 知识库体检发现 $count 个问题" --label wiki-lint --body-file .cache/lint_body.md
          fi
